name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only: the tests and the audit never write to the repository, and a
# pull request from a fork runs them too.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Locally the git push/pull tests run on the system-git engine only;
      # CI runs the full cli/gh/js matrix (tests/helpers/engines.ts).
      - name: Run tests
        run: bun test
        env:
          SPECDRIVEN_ALL_ENGINES: "1"

  # Bun runs and bundles TypeScript without checking types, so a dangling
  # reference (v0.1.177's leftover <ScenarioTable>) passes the build and the
  # tests. tsc catches it; typescript comes from peerDependencies.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # GHSA-ch52-4w7c-c8xp (http-cache-semantics <=4.2.0) has no patched
      # release. It reaches us only through electron-builder's @electron/get@3
      # → got → cacheable-request, a build-time downloader of Electron
      # binaries that sets no shared cache, so the cross-user disclosure
      # doesn't apply. @electron/get@5 drops got, but electron-builder passes
      # it got-only proxy/TLS options, so it can't be overridden. Drop this
      # ignore once electron-builder moves off @electron/get@3 or a fix ships.
      #
      # GHSA-g3hv-75wg-m249 (minimatch <11.0.1, globparts DoS) is fixed only
      # in minimatch 11. Every copy we install comes through dev or build
      # tooling (eslint, typescript-eslint, ts-morph, electron-builder), which
      # matches only our own glob patterns, and glob@7 / dir-compare still
      # need the minimatch 3 API, so a blanket override would break packaging.
      # Drop this ignore once those tools move to minimatch 11.
      - name: Audit dependencies
        run: bun audit --ignore GHSA-ch52-4w7c-c8xp --ignore GHSA-g3hv-75wg-m249
