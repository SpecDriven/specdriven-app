name: install.ps1

# tests/installPs1.test.ts starts a PowerShell for every run of the installer,
# which is too slow for the suite every pull request runs (test.yml), where
# those tests skip. Here they run only when the installer, its tests or the
# helpers they stand on change (specs/app/installation.feature.md "install on
# Windows from PowerShell"). Ubuntu runners come with PowerShell 7.

on:
  push:
    branches: [ main ]
    paths:
      - install.ps1
      - tests/installPs1.test.ts
      - tests/helpers/fakeBin.ts
      - tests/helpers/fakeReleases.ts
      - tests/helpers/terminal.py
      - .github/workflows/install-ps1.yml
  pull_request:
    branches: [ main ]
    paths:
      - install.ps1
      - tests/installPs1.test.ts
      - tests/helpers/fakeBin.ts
      - tests/helpers/fakeReleases.ts
      - tests/helpers/terminal.py
      - .github/workflows/install-ps1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the install.ps1 tests
        run: SPECDRIVEN_TEST_PWSH="$(command -v pwsh)" bun test tests/installPs1.test.ts
