name: Release macOS

# Cut by the version bump: `bun run bump <patch|minor|major>` tags v<version>
# (roadmap/deployment.md "Versioning"), and pushing that tag runs this. The
# bump script does not push for you — `git push origin main --follow-tags`.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing v<version> tag to build and publish
        required: true

permissions:
  contents: write # create the release and upload the dmg to it

# Two runs against one tag would race to upload the same asset.
concurrency:
  group: release-macos-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    # A dmg needs macOS tooling (hdiutil), which is why scripts/build-desktop.ts
    # refuses --mac anywhere else. The app is packaged arm64-only — see "mac"
    # under "build" in package.json — so this wants an Apple-silicon runner.
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      # electron-builder names the dmg after package.json, not after the tag.
      # If the two disagree, v1.2.3 would hang a SpecDriven-1.2.2 dmg — so stop
      # before building rather than publish something mislabelled.
      - name: Check the tag matches package.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match package.json version $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_ENV"

      # The Test workflow covers pushes to main, not tags. A release is the
      # last place to find out the suite is red.
      - name: Run tests
        run: bun test

      # There is no signing certificate in CI, so stop electron-builder from
      # hunting for one in the runner keychain: the dmg ships unsigned and
      # un-notarized either way, and auto-discovery only makes which it is
      # depend on the runner image. GH_TOKEN is deliberately absent here —
      # with a token in the environment electron-builder publishes the release
      # itself, and publishing belongs to the step below.
      - name: Build the dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run build:desktop --mac

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg="release/SpecDriven-$version-arm64.dmg"
          if [ ! -f "$dmg" ]; then
            echo "no dmg at $dmg — electron-builder produced:" >&2
            ls -la release >&2
            exit 1
          fi

          # Re-running a dispatch against a published tag replaces the asset
          # rather than failing on the release already being there.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$dmg" --clobber
          else
            gh release create "$tag" "$dmg" \
              --title "$tag" \
              --generate-notes \
              --notes "Unsigned and un-notarized: macOS will refuse to open this build on first launch. Right-click the app and choose Open, or clear the quarantine flag with \`xattr -dr com.apple.quarantine /Applications/SpecDriven.app\`."
          fi
