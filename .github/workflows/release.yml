name: Release

# Pushing a v<version> tag (what `bun run bump` creates) publishes a source
# snapshot of that commit as a GitHub Release on this repository. install.sh
# and install.ps1 — the ones `curl | sh` and `irm | iex` fetch — are served
# straight from `main` (specs/app/installation.feature.md), and every release
# carries the copies it shipped with.
# See README.md "Versioning" and "Distribution".

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches package.json
        id: meta
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Build source zip
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git archive --format=zip --prefix="specdriven-$VERSION/" \
            -o "specdriven-$VERSION-src.zip" "$GITHUB_REF_NAME"
          sha256sum "specdriven-$VERSION-src.zip" > SHASUMS256.txt
          cat SHASUMS256.txt

      # A release that already exists is not overwritten: re-running on the
      # same tag fails, on purpose.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          notes="$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s' \
            "Source snapshot of $GITHUB_REPOSITORY at v$VERSION ($GITHUB_SHA)." \
            "**Install:** \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh\` downloads \`specdriven-$VERSION-src.zip\`, verifies it against \`SHASUMS256.txt\`, unpacks it under \`~/.specdriven/app\`, builds it and starts it. It offers to install [Bun](https://bun.sh) first if the machine has none." \
            "**Install on Windows** (PowerShell): \`irm https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.ps1 | iex\` does the same under \`%USERPROFILE%\\.specdriven\\app\`, adds SpecDriven to the Start menu and starts it." \
            "**To review the source before it runs:** download \`specdriven-$VERSION-src.zip\`, verify it against \`SHASUMS256.txt\`, and unzip it yourself." \
            "SpecDriven is built with [Bun](https://bun.sh): \`bun install\`, then \`bun run start\` for the web app or \`bun run build:desktop\` for the desktop installer." \
            "GitHub also attaches its own *Source code (zip)* and *Source code (tar.gz)* to every release; \`specdriven-$VERSION-src.zip\` is the one \`SHASUMS256.txt\` vouches for and the installers download.")"
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SpecDriven v$VERSION" \
            --notes "$notes" \
            "specdriven-$VERSION-src.zip" SHASUMS256.txt install.sh install.ps1
