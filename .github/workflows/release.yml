name: Release

# Pushing a v<version> tag (what `bun run bump` creates) publishes a source
# snapshot of that commit as a GitHub Release on SpecDriven/specdriven-app-release,
# and keeps that repository's install.sh — the one `curl | sh` fetches — in
# step with this repository's (specs/app/installation.feature.md).
# See README.md "Versioning" and "Distribution".
#
# Needs the RELEASE_REPO_TOKEN secret: a fine-grained PAT with Contents:
# read/write on specdriven-app-release. The default GITHUB_TOKEN cannot write
# to another repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RELEASE_REPO: SpecDriven/specdriven-app-release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check the tag matches package.json
        id: meta
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Build source zip
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git archive --format=zip --prefix="specdriven-$VERSION/" \
            -o "specdriven-$VERSION-src.zip" "$GITHUB_REF_NAME"
          sha256sum "specdriven-$VERSION-src.zip" > SHASUMS256.txt
          cat SHASUMS256.txt

      # Comes before the release so a failure here leaves nothing behind: the
      # release step refuses to overwrite an existing release, so the tag can
      # simply be re-run. The blob sha git computes is the sha GitHub's
      # contents API reports, which is how "unchanged" is decided.
      - name: Publish install.sh to specdriven-app-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          local_sha="$(git hash-object install.sh)"
          remote_sha="$(gh api "repos/$RELEASE_REPO/contents/install.sh" --jq .sha 2>/dev/null || true)"
          if [ "$local_sha" = "$remote_sha" ]; then
            echo "install.sh on $RELEASE_REPO is already at $local_sha"
            exit 0
          fi
          args=(-f "message=Update install.sh from specdriven-app v$VERSION"
                -f "content=$(base64 -w0 install.sh)")
          if [ -n "$remote_sha" ]; then
            args+=(-f "sha=$remote_sha")
          fi
          gh api -X PUT "repos/$RELEASE_REPO/contents/install.sh" "${args[@]}" --jq '.content.sha'

      - name: Create release on specdriven-app-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          notes="$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s' \
            "Source snapshot of SpecDriven/specdriven-app at v$VERSION ($GITHUB_SHA)." \
            "**Install:** \`curl -fsSL https://raw.githubusercontent.com/$RELEASE_REPO/main/install.sh | sh\` downloads \`specdriven-$VERSION-src.zip\`, verifies it against \`SHASUMS256.txt\`, unpacks it under \`~/.specdriven/app\`, builds it and starts it. It offers to install [Bun](https://bun.sh) first if the machine has none." \
            "**To review the source before it runs:** download \`specdriven-$VERSION-src.zip\`, verify it against \`SHASUMS256.txt\`, and unzip it yourself." \
            "SpecDriven is built with [Bun](https://bun.sh): \`bun install\`, then \`bun run start\` for the web app or \`bun run build:desktop\` for the desktop installer." \
            "Ignore the auto-generated *Source code (zip)* and *Source code (tar.gz)* entries below: GitHub attaches them to every release and they only contain this repository's README, not the app.")"
          gh release create "v$VERSION" \
            --repo "$RELEASE_REPO" \
            --title "SpecDriven v$VERSION" \
            --notes "$notes" \
            "specdriven-$VERSION-src.zip" SHASUMS256.txt install.sh
