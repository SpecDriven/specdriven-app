name: Release

# Pushing a v<version> tag (what `bun run bump` creates) publishes a source
# snapshot of that commit as a GitHub Release on this repository. install.sh
# and install.ps1 — the ones `curl | sh` and `irm | iex` fetch — are served
# straight from `main` (specs/app/installation.feature.md), and every release
# carries the copies it shipped with.
#
# A release is verifiable by origin, not only by checksum (docs/releasing.md
# "Signing and provenance"):
# - SHASUMS256.txt is signed with the release signing key (an SSH Ed25519
#   key, `ssh-keygen -Y sign`), and the signature ships as
#   SHASUMS256.txt.sig. The installers embed the public key and refuse a
#   release whose signature is missing or does not verify. The private key
#   is the SPECDRIVEN_RELEASE_SIGNING_KEY secret.
# - The zip, the Windows installers and SHASUMS256.txt get GitHub build
#   provenance (a Sigstore attestation naming this workflow and commit),
#   checked with `gh attestation verify`.
#
# Every release also carries prebuilt Windows installers,
# SpecDriven-<version>-<arch>-setup.exe for x64 and arm64, each built and
# smoke-tested on a native runner of its architecture (cbor-extract's native
# module is only installed for the machine bun runs on). They are not
# code-signed yet (scripts/build-desktop.ts "Windows signing"). Releases are
# immutable, so nothing can be attached after `gh release create`: publish
# waits for both installers, and a failed Windows build publishes nothing.
#
# A pull request that touches the release or the desktop build runs the
# Windows builds alone — publish only runs for a tag — so they are proven
# before a tag is spent on them.
# See README.md "Versioning" and "Distribution".

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/release.yml
      - scripts/build-desktop.ts
      - src/electron/**
      - package.json
      - bun.lock

permissions:
  contents: read

jobs:
  windows:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the installer
        run: bun run build:desktop --win --host-arch

      # Installs it silently, starts the installed app and waits for its
      # window to load app://specdriven, then checks it is still running a
      # few seconds later: the launch-time crashes the desktop build has had
      # (a missing wasm, a native module built for another machine) end the
      # process before that.
      - name: Smoke-test the installed app
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem release -Filter "SpecDriven-*-$env:ARCH-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "no $env:ARCH installer in release/" }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\SpecDriven\SpecDriven.exe'
          if (-not (Test-Path $exe)) { throw "$exe is missing after a silent install" }
          Get-Process SpecDriven -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:SPECDRIVEN_HOME = Join-Path $env:RUNNER_TEMP 'specdriven-home'
          $app = Start-Process -FilePath $exe -ArgumentList '--remote-debugging-port=9229' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $page = $null
            while (-not $page -and (Get-Date) -lt $deadline) {
              if ($app.HasExited) { throw "SpecDriven exited with code $($app.ExitCode) before its window loaded" }
              try {
                $page = Invoke-RestMethod http://127.0.0.1:9229/json/list |
                  Where-Object { $_.type -eq 'page' -and $_.url -like 'app://specdriven*' } |
                  Select-Object -First 1
              } catch {}
              if (-not $page) { Start-Sleep -Seconds 2 }
            }
            if (-not $page) { throw 'no app://specdriven window within 90s' }
            Write-Host "window loaded: $($page.url)"
            Start-Sleep -Seconds 10
            if ($app.HasExited) { throw "SpecDriven exited with code $($app.ExitCode) after its window loaded" }
          } finally {
            Get-Process SpecDriven -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: release/SpecDriven-*-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  publish:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag matches package.json
        id: meta
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Download the Windows installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          merge-multiple: true

      # The installers look up their own file's line in SHASUMS256.txt, so
      # the lines for the Windows installers do not get in their way.
      - name: Build source zip and checksums
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git archive --format=zip --prefix="specdriven-$VERSION/" \
            -o "specdriven-$VERSION-src.zip" "$GITHUB_REF_NAME"
          sha256sum "specdriven-$VERSION-src.zip" \
            "SpecDriven-$VERSION-x64-setup.exe" "SpecDriven-$VERSION-arm64-setup.exe" > SHASUMS256.txt
          cat SHASUMS256.txt

      # ssh-keygen signs the checksum file with the release signing key, in
      # the "specdriven-release" namespace, as release@specdriven.app. Then
      # the signature is checked against the public key install.sh embeds:
      # a rotated secret that the installers do not know yet fails here, not
      # on every user's machine.
      - name: Sign SHASUMS256.txt
        env:
          SIGNING_KEY: ${{ secrets.SPECDRIVEN_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "the SPECDRIVEN_RELEASE_SIGNING_KEY secret is not set; see docs/releasing.md" >&2
            exit 1
          fi
          key="$(mktemp)"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          ssh-keygen -Y sign -f "$key" -n specdriven-release SHASUMS256.txt
          rm -f "$key"
          pubkey="$(sed -n 's/^SIGNER_KEY="\(ssh-ed25519 [^"]*\)"$/\1/p' install.sh)"
          printf 'release@specdriven.app %s\n' "$pubkey" > allowed_signers
          ssh-keygen -Y verify -f allowed_signers -I release@specdriven.app \
            -n specdriven-release -s SHASUMS256.txt.sig < SHASUMS256.txt
          grep -qF "$pubkey" install.ps1 \
            || { echo "install.ps1 does not embed the key install.sh does" >&2; exit 1; }

      # Before the release exists, so a published release always has its
      # provenance: a failure here leaves no release behind, and the re-run
      # starts over.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            specdriven-${{ steps.meta.outputs.version }}-src.zip
            SpecDriven-${{ steps.meta.outputs.version }}-x64-setup.exe
            SpecDriven-${{ steps.meta.outputs.version }}-arm64-setup.exe
            SHASUMS256.txt

      # A release that already exists is not overwritten: re-running on the
      # same tag fails, on purpose.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          notes="$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s\n\n%s' \
            "Source snapshot of $GITHUB_REPOSITORY at v$VERSION ($GITHUB_SHA)." \
            "**Install:** \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sh\` downloads \`specdriven-$VERSION-src.zip\`, checks the signature on \`SHASUMS256.txt\` and the zip's checksum against it, unpacks it under \`~/.specdriven/app\`, builds it and starts it. It offers to install [Bun](https://bun.sh) first if the machine has none." \
            "**Install on Windows** (PowerShell): \`irm https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.ps1 | iex\` does the same under \`%USERPROFILE%\\.specdriven\\app\`, adds SpecDriven to the Start menu and starts it." \
            "**Windows installer:** \`SpecDriven-$VERSION-x64-setup.exe\` (or \`-arm64-setup.exe\` for Windows on ARM) installs the prebuilt desktop app without Bun or a build. It is not code-signed yet, so SmartScreen asks first: *More info*, then *Run anyway*. Check it against \`SHASUMS256.txt\` (\`certutil -hashfile <file> SHA256\`) or with \`gh attestation verify\` as below." \
            "**To review the source before it runs:** download \`specdriven-$VERSION-src.zip\`, \`SHASUMS256.txt\` and \`SHASUMS256.txt.sig\`, verify them as below, and unzip it yourself." \
            "**To verify this release by hand:** \`gh attestation verify specdriven-$VERSION-src.zip --repo $GITHUB_REPOSITORY\` checks GitHub's build provenance (this workflow, this commit). Offline, \`SHASUMS256.txt.sig\` is an SSH signature by the SpecDriven release key, \`release@specdriven.app\`; with the key the installers embed in a one-line \`allowed_signers\` file, \`ssh-keygen -Y verify -f allowed_signers -I release@specdriven.app -n specdriven-release -s SHASUMS256.txt.sig < SHASUMS256.txt\`, then \`sha256sum -c SHASUMS256.txt\`. The steps are spelled out in [docs/installation.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/installation.md)." \
            "SpecDriven is built with [Bun](https://bun.sh): \`bun install --frozen-lockfile\`, then \`bun run start\` for the web app or \`bun run build:desktop\` for the desktop installer." \
            "GitHub also attaches its own *Source code (zip)* and *Source code (tar.gz)* to every release; \`specdriven-$VERSION-src.zip\` is the one \`SHASUMS256.txt\` vouches for and the installers download.")"
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SpecDriven v$VERSION" \
            --notes "$notes" \
            "specdriven-$VERSION-src.zip" \
            "SpecDriven-$VERSION-x64-setup.exe" "SpecDriven-$VERSION-arm64-setup.exe" \
            SHASUMS256.txt SHASUMS256.txt.sig install.sh install.ps1
