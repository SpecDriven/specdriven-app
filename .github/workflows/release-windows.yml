name: Release Windows installers

# Builds the prebuilt Windows installers for a published release, on
# request: Actions → "Release Windows installers" → Run workflow, or
#
#   gh workflow run release-windows.yml --repo SpecDriven/specdriven-app [-f version=0.1.211]
#
# Without a version it builds the latest release. They are not part of
# every release (release.yml) because they take minutes where the source
# release takes seconds.
#
# SpecDriven-<version>-<arch>-setup.exe for x64 and arm64 are each built
# from the v<version> tag and smoke-tested on a native runner of their
# architecture (cbor-extract's native module is only installed for the
# machine bun runs on). They are not code-signed yet
# (scripts/build-desktop.ts "Windows signing").
#
# Releases are immutable, so the installers cannot be attached to the
# v<version> release once it exists. They are published as a release of
# their own, windows-v<version>, at the same commit, with their own signed
# SHASUMS256.txt and build provenance (docs/releasing.md). It is never
# marked latest: install.sh, install.ps1 and the app's "new version" check
# follow /releases/latest to the v<version> release. A version's Windows
# release can be published once; a failed run publishes nothing and can be
# re-run.
#
# A pull request that touches the release or the desktop build runs the
# Windows builds alone, without publishing, so a broken build shows up
# before someone asks for installers.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to build the Windows installers for, e.g. 0.1.211 (empty: the latest release)"
        required: false
        default: ""
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/release-windows.yml
      - scripts/build-desktop.ts
      - src/electron/**
      - package.json
      - bun.lock

permissions:
  contents: read

jobs:
  # Which release to build: its v<version> tag must have a published
  # release, and there must not be a windows-v<version> release yet.
  resolve:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - name: Pick the release
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
        run: |
          version="${INPUT#v}"
          if [ -z "$version" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
            version="${tag#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "\"$version\" is not a version like 0.1.211" >&2
            exit 1
          fi
          if ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null; then
            echo "there is no v$version release to build Windows installers for" >&2
            exit 1
          fi
          if gh release view "windows-v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "windows-v$version is published already; releases are immutable" >&2
            exit 1
          fi
          echo "building the Windows installers for v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: resolve
    # On a pull request resolve is skipped, and this builds the PR's commit.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.version && format('refs/tags/v{0}', needs.resolve.outputs.version) || '' }}

      - name: Check the tag matches package.json
        if: needs.resolve.outputs.version
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          pkg="$(jq -r .version package.json)"
          if [ "$VERSION" != "$pkg" ]; then
            echo "tag v$VERSION does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the installer
        run: bun run build:desktop --win --host-arch

      # Installs it silently, starts the installed app and waits for its
      # window to load app://specdriven, then checks it is still running a
      # few seconds later: the launch-time crashes the desktop build has had
      # (a missing wasm, a native module built for another machine) end the
      # process before that.
      - name: Smoke-test the installed app
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem release -Filter "SpecDriven-*-$env:ARCH-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "no $env:ARCH installer in release/" }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\SpecDriven\SpecDriven.exe'
          if (-not (Test-Path $exe)) { throw "$exe is missing after a silent install" }
          Get-Process SpecDriven -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:SPECDRIVEN_HOME = Join-Path $env:RUNNER_TEMP 'specdriven-home'
          $app = Start-Process -FilePath $exe -ArgumentList '--remote-debugging-port=9229' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $page = $null
            while (-not $page -and (Get-Date) -lt $deadline) {
              if ($app.HasExited) { throw "SpecDriven exited with code $($app.ExitCode) before its window loaded" }
              try {
                $page = Invoke-RestMethod http://127.0.0.1:9229/json/list |
                  Where-Object { $_.type -eq 'page' -and $_.url -like 'app://specdriven*' } |
                  Select-Object -First 1
              } catch {}
              if (-not $page) { Start-Sleep -Seconds 2 }
            }
            if (-not $page) { throw 'no app://specdriven window within 90s' }
            Write-Host "window loaded: $($page.url)"
            Start-Sleep -Seconds 10
            if ($app.HasExited) { throw "SpecDriven exited with code $($app.ExitCode) after its window loaded" }
          } finally {
            Get-Process SpecDriven -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: release/SpecDriven-*-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  publish:
    needs: [resolve, windows]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.resolve.outputs.version }}

      - name: Download the Windows installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          merge-multiple: true

      - name: Build checksums
        run: |
          sha256sum "SpecDriven-$VERSION-x64-setup.exe" "SpecDriven-$VERSION-arm64-setup.exe" > SHASUMS256.txt
          cat SHASUMS256.txt

      # Signed with the release signing key, as release.yml signs the source
      # release, and checked against the public key install.sh embeds.
      - name: Sign SHASUMS256.txt
        env:
          SIGNING_KEY: ${{ secrets.SPECDRIVEN_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "the SPECDRIVEN_RELEASE_SIGNING_KEY secret is not set; see docs/releasing.md" >&2
            exit 1
          fi
          key="$(mktemp)"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          ssh-keygen -Y sign -f "$key" -n specdriven-release SHASUMS256.txt
          rm -f "$key"
          pubkey="$(sed -n 's/^SIGNER_KEY="\(ssh-ed25519 [^"]*\)"$/\1/p' install.sh)"
          printf 'release@specdriven.app %s\n' "$pubkey" > allowed_signers
          ssh-keygen -Y verify -f allowed_signers -I release@specdriven.app \
            -n specdriven-release -s SHASUMS256.txt.sig < SHASUMS256.txt

      # Before the release exists, so a published release always has its
      # provenance.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            SpecDriven-${{ needs.resolve.outputs.version }}-x64-setup.exe
            SpecDriven-${{ needs.resolve.outputs.version }}-arm64-setup.exe
            SHASUMS256.txt

      # --latest=false: /releases/latest has to keep naming v<version>, which
      # the installers and the app follow.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(printf '%s\n\n%s\n\n%s' \
            "Prebuilt Windows installers for [SpecDriven v$VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION), built from the \`v$VERSION\` tag ($(git rev-parse HEAD))." \
            "\`SpecDriven-$VERSION-x64-setup.exe\` (or \`-arm64-setup.exe\` for Windows on ARM) installs the prebuilt desktop app without Bun or a build. It is not code-signed yet, so SmartScreen asks first: *More info*, then *Run anyway*." \
            "**To verify an installer:** \`gh attestation verify SpecDriven-$VERSION-x64-setup.exe --repo $GITHUB_REPOSITORY\`, or check \`SHASUMS256.txt.sig\` against the SpecDriven release key and compare \`certutil -hashfile <file> SHA256\` with its line in \`SHASUMS256.txt\`, as [docs/installation.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/installation.md) describes.")"
          gh release create "windows-v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --latest=false \
            --title "SpecDriven v$VERSION Windows installers" \
            --notes "$notes" \
            "SpecDriven-$VERSION-x64-setup.exe" "SpecDriven-$VERSION-arm64-setup.exe" \
            SHASUMS256.txt SHASUMS256.txt.sig
