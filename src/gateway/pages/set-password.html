<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Choose a password · SpecDriven</title>
    <link rel="stylesheet" href="./gateway.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body data-page="set-password">
    <main class="card">
      <h1 class="brand">SpecDriven</h1>
      <h2>Choose a password</h2>
      <form id="form" novalidate>
        <label>New password <input name="password" type="password" autocomplete="new-password" minlength="12" required autofocus /></label>
        <label>Repeat it <input name="confirm" type="password" autocomplete="new-password" minlength="12" required /></label>
        <p class="hint">At least 12 characters. A long passphrase is easiest.</p>
        <p class="error" role="alert" hidden></p>
        <button type="submit">Save password and sign in</button>
      </form>
      <p class="links"><a href="/forgot">Need a new link?</a></p>
    </main>
  </body>
</html>
