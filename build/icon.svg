<?xml version="1.0" encoding="UTF-8"?>
<!--
  The SpecDriven application icon, master artwork (specs/app/desktop-app.feature.md
  "Packaging"). The same mark as the sidebar logo (src/frontend/Logo.tsx): the
  accent-indigo tile, two "spec lines" standing for a written spec, and the SD
  wordmark. Full-bleed on a 1024 canvas; `bun run build:icons` rasterizes it
  into icon.icns, icon.ico, icon.png and icons/ next to this file, adding the
  transparent margin macOS and Linux icons carry.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="SpecDriven">
  <defs>
    <linearGradient id="tile-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8089ee"/>
      <stop offset="0.55" stop-color="#5e6ad2"/>
      <stop offset="1" stop-color="#3f49ad"/>
    </linearGradient>
    <linearGradient id="tile-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="232"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#tile-fill)"/>
    <rect width="1024" height="512" fill="url(#tile-sheen)"/>
  </g>
  <!-- A faint inner edge keeps the tile crisp against light and dark docks. -->
  <rect x="7" y="7" width="1010" height="1010" rx="227" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="14"/>
  <!-- Spec lines: a title and a shorter line under it. -->
  <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="44" stroke-linecap="round">
    <line x1="208" y1="226" x2="612" y2="226"/>
    <line x1="208" y1="340" x2="464" y2="340"/>
  </g>
  <text x="512" y="632" text-anchor="middle" dominant-baseline="central" font-family="'Inter Variable', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="416" font-weight="700" letter-spacing="-12" fill="#ffffff">SD</text>
</svg>
